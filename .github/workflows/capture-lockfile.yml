name: Capture dependency lockfile

on:
  push:
    branches:
      - 'chatpro/rollindd-next-control-preview-20260816'
    paths:
      - '.github/workflows/capture-lockfile.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve exact dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: rollindd-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
