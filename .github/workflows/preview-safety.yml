name: Preview safety

on:
  push:
    branches:
      - 'chatpro/**'
      - 'agent/**'
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate preview candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run required validation and write receipt
        run: node scripts/validate-preview.mjs

      - name: Upload Clover build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover-build-receipt-${{ github.sha }}
          path: .clover/artifacts/build-receipt.json
          if-no-files-found: warn
          retention-days: 30
