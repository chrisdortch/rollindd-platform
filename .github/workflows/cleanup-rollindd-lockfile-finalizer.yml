name: Clean up RollinD lockfile bootstrap workflows

on:
  push:
    branches:
      - chatpro/rollindd-clean-collection-v2-preview-20260817
    paths:
      - .github/workflows/cleanup-rollindd-lockfile-finalizer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatpro/rollindd-clean-collection-v2-preview-20260817
          fetch-depth: 0
          persist-credentials: true

      - name: Remove only the one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch \
            .github/workflows/finalize-rollindd-lockfile.yml \
            .github/workflows/cleanup-rollindd-lockfile-finalizer.yml
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/cleanup-rollindd-lockfile-finalizer.yml \
            .github/workflows/finalize-rollindd-lockfile.yml | LC_ALL=C sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Refusing unexpected cleanup diff.' >&2
            printf 'Expected:\n%s\nObserved:\n%s\n' "$expected" "$changed" >&2
            exit 1
          fi
          git commit -m 'Remove one-time RollinD lockfile workflows'
          git push origin HEAD:chatpro/rollindd-clean-collection-v2-preview-20260817
