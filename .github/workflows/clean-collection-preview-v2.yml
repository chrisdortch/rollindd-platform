name: Validate clean collection preview v2

on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/sites/[slug]/page.tsx'
      - 'components/CollectionExperience.tsx'
      - 'components/CollectionExperience.module.css'
      - 'package.json'
      - '.github/workflows/clean-collection-preview-v2.yml'
  workflow_dispatch:
    inputs:
      include_webkit:
        description: 'Include the slower mobile WebKit release-evidence journey'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: rollindd-clean-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      CLOVER_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOVER_BASE_SHA: 6875efcc3801b7cd97de4bd6edcbb4fe4cd85d09
      CLOVER_INCLUDE_WEBKIT: ${{ github.event_name == 'workflow_dispatch' && inputs.include_webkit || false }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CLOVER_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Prove bounded diff and repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .clover-preview-evidence
          git diff --check "${CLOVER_BASE_SHA}...${CLOVER_CANDIDATE_SHA}"
          git diff --name-only "${CLOVER_BASE_SHA}...${CLOVER_CANDIDATE_SHA}" | LC_ALL=C sort > .clover-preview-evidence/changed-files.txt
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            '.github/workflows/clean-collection-preview-v2.yml',
            'app/page.tsx',
            'app/sites/[slug]/page.tsx',
            'components/CollectionExperience.module.css',
            'components/CollectionExperience.tsx',
            'package.json'
          ].sort();
          const actual = fs.readFileSync('.clover-preview-evidence/changed-files.txt', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error(JSON.stringify({ expected, actual }, null, 2));
            process.exit(1);
          }
          fs.writeFileSync(
            '.clover-preview-evidence/diff-boundary.json',
            `${JSON.stringify({ status: 'passed', expected, actual }, null, 2)}\n`
          );
          NODE

      - name: Resolve and freeze this validation run's dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          cp package-lock.json .clover-preview-evidence/resolved-package-lock.json
          sha256sum package-lock.json > .clover-preview-evidence/resolved-package-lock.sha256
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            '@vercel/postgres': '0.10.0',
            next: '16.3.1',
            react: '19.2.8',
            'react-dom': '19.2.8',
            '@types/node': '26.2.0',
            '@types/react': '19.2.18',
            '@types/react-dom': '19.2.4',
            eslint: '9.39.5',
            'eslint-config-next': '16.3.1',
            typescript: '6.0.3'
          };
          const actual = {};
          for (const [name, version] of Object.entries(expected)) {
            actual[name] = lock.packages?.[`node_modules/${name}`]?.version || null;
            if (actual[name] !== version) {
              console.error(`${name}: expected ${version}, observed ${actual[name]}`);
              process.exit(1);
            }
          }
          fs.writeFileSync(
            '.clover-preview-evidence/dependency-versions.json',
            `${JSON.stringify({ status: 'passed', expected, actual }, null, 2)}\n`
          );
          NODE

      - name: Run source and production-build gates
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Install only the browser engines required by this gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.62.1
          if [[ "${CLOVER_INCLUDE_WEBKIT}" == "true" ]]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Create bounded interaction tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .clover-preview-tests .clover-preview-evidence/screenshots
          cat > .clover-preview-tests/playwright.config.mjs <<'CONFIG'
          import { defineConfig, devices } from '@playwright/test';

          const projects = [
            { name: 'desktop-chromium', use: { ...devices['Desktop Chrome'], viewport: { width: 1440, height: 1000 } } },
            { name: 'mobile-chromium', use: { ...devices['Pixel 7'] } }
          ];
          if (process.env.CLOVER_INCLUDE_WEBKIT === 'true') {
            projects.push({ name: 'mobile-webkit', use: { ...devices['iPhone 14'] } });
          }

          export default defineConfig({
            testDir: '.',
            outputDir: '../.clover-preview-evidence/test-results',
            timeout: 35_000,
            expect: { timeout: 10_000 },
            workers: 1,
            retries: 1,
            reporter: [
              ['list'],
              ['html', { outputFolder: '../.clover-preview-evidence/playwright-report', open: 'never' }]
            ],
            use: {
              baseURL: 'http://127.0.0.1:4173',
              locale: 'en-US',
              timezoneId: 'America/Chicago',
              reducedMotion: 'reduce',
              trace: 'retain-on-failure',
              video: 'retain-on-failure',
              screenshot: 'only-on-failure'
            },
            projects
          });
          CONFIG

          cat > .clover-preview-tests/collection-v2.spec.mjs <<'TEST'
          import { mkdirSync } from 'node:fs';
          import { test, expect } from '@playwright/test';

          mkdirSync('.clover-preview-evidence/screenshots', { recursive: true });

          function silentWav() {
            const sampleRate = 8000;
            const seconds = 0.35;
            const dataSize = Math.floor(sampleRate * seconds);
            const buffer = Buffer.alloc(44 + dataSize);
            buffer.write('RIFF', 0);
            buffer.writeUInt32LE(36 + dataSize, 4);
            buffer.write('WAVE', 8);
            buffer.write('fmt ', 12);
            buffer.writeUInt32LE(16, 16);
            buffer.writeUInt16LE(1, 20);
            buffer.writeUInt16LE(1, 22);
            buffer.writeUInt32LE(sampleRate, 24);
            buffer.writeUInt32LE(sampleRate, 28);
            buffer.writeUInt16LE(1, 32);
            buffer.writeUInt16LE(8, 34);
            buffer.write('data', 36);
            buffer.writeUInt32LE(dataSize, 40);
            buffer.fill(128, 44);
            return buffer;
          }

          for (const routePath of ['/', '/sites/rollindd']) {
            test(`clean collection transition at ${routePath}`, async ({ page }, testInfo) => {
              const consoleErrors = [];
              const pageErrors = [];
              const failedSameOriginRequests = [];
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => pageErrors.push(error.message));
              page.on('requestfailed', (request) => {
                if (request.url().startsWith('http://127.0.0.1:4173')) {
                  failedSameOriginRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText || ''}`);
                }
              });

              await page.addInitScript(() => {
                Object.defineProperty(navigator, 'share', {
                  configurable: true,
                  value: async (data) => {
                    window.__cloverSharedCollection = data;
                  }
                });
              });
              await page.route(/\.mp3(?:\?.*)?$/i, (route) => route.fulfill({
                status: 200,
                contentType: 'audio/wav',
                body: silentWav()
              }));

              const response = await page.goto(`${routePath}?_vercel_share=temporary-review-token`, {
                waitUntil: 'domcontentloaded'
              });
              expect(response?.ok()).toBeTruthy();

              const routeSlug = routePath === '/' ? 'home' : 'site-rollindd';
              const projectName = testInfo.project.name;
              const isMobile = projectName.startsWith('mobile-');
              const introHeading = page.getByRole('heading', { name: 'RollinDD', exact: true });
              const enterButton = page.getByRole('button', { name: 'Enter the collection' });
              const shareButton = page.getByRole('button', { name: 'Share collection' });
              const player = page.getByRole('region', { name: 'Player' });

              await expect(introHeading).toBeVisible();
              await expect(enterButton).toBeVisible();
              await expect(page.getByRole('heading', { name: '7 Productions' })).toHaveCount(0);
              await expect(player).toBeHidden();

              if (isMobile) {
                const enterBox = await enterButton.boundingBox();
                const shareBox = await shareButton.boundingBox();
                expect(enterBox).not.toBeNull();
                expect(shareBox).not.toBeNull();
                expect(enterBox.width).toBeGreaterThan(shareBox.width * 1.8);
              }

              await page.screenshot({
                path: `.clover-preview-evidence/screenshots/${projectName}-${routeSlug}-intro.png`,
                fullPage: false,
                animations: 'disabled'
              });

              await shareButton.click();
              const sharedUrl = await page.evaluate(() => window.__cloverSharedCollection?.url || '');
              const parsedShareUrl = new URL(sharedUrl);
              expect(parsedShareUrl.pathname).toBe(routePath);
              expect(parsedShareUrl.search).toBe('');
              expect(parsedShareUrl.hash).toBe('');

              await enterButton.click();
              await expect(page.getByRole('heading', { name: '7 Productions' })).toBeVisible();
              await expect(page.getByRole('button', { name: 'Collection intro' })).toBeVisible();
              await expect(introHeading).toHaveCount(0);
              await expect(player).toBeHidden();

              await page.screenshot({
                path: `.clover-preview-evidence/screenshots/${projectName}-${routeSlug}-library-idle.png`,
                fullPage: false,
                animations: 'disabled'
              });

              await page
                .getByRole('button', { name: 'Play I. The Essence of Fearlessness' })
                .first()
                .click();
              await expect(player).toBeVisible();
              await page.waitForTimeout(300);

              const playerBox = await player.boundingBox();
              const viewport = page.viewportSize();
              expect(playerBox).not.toBeNull();
              expect(viewport).not.toBeNull();
              expect(playerBox.y).toBeGreaterThanOrEqual(0);
              expect(playerBox.y + playerBox.height).toBeLessThanOrEqual(viewport.height + 1);
              if (isMobile) {
                expect(playerBox.height).toBeLessThanOrEqual(150);
              }

              const overflow = await page.evaluate(
                () => document.documentElement.scrollWidth - window.innerWidth
              );
              expect(overflow).toBeLessThanOrEqual(1);

              await page.screenshot({
                path: `.clover-preview-evidence/screenshots/${projectName}-${routeSlug}-player-active.png`,
                fullPage: false,
                animations: 'disabled'
              });

              expect(consoleErrors).toEqual([]);
              expect(pageErrors).toEqual([]);
              expect(failedSameOriginRequests).toEqual([]);

              await page.getByRole('button', { name: 'Collection intro' }).click();
              await expect(page.getByRole('heading', { name: 'RollinDD', exact: true })).toBeVisible();
              await expect(page.getByRole('heading', { name: '7 Productions' })).toHaveCount(0);
            });
          }
          TEST

      - name: Run browser journeys
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 4173 > .clover-preview-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          node <<'NODE'
          const url = 'http://127.0.0.1:4173/';
          for (let attempt = 0; attempt < 90; attempt += 1) {
            try {
              const response = await fetch(url, { redirect: 'manual' });
              if (response.status < 500) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          process.exit(1);
          NODE

          npx playwright test --config=.clover-preview-tests/playwright.config.mjs

      - name: Write non-authorizing receipt
        if: always()
        shell: bash
        run: |
          mkdir -p .clover-preview-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const changedFiles = fs.existsSync('.clover-preview-evidence/changed-files.txt')
            ? fs.readFileSync('.clover-preview-evidence/changed-files.txt', 'utf8').split(/\r?\n/).filter(Boolean)
            : [];
          const receipt = {
            schemaVersion: '1.2',
            project: 'rollindd-platform',
            candidateCommit: process.env.CLOVER_CANDIDATE_SHA,
            workflowCommit: process.env.GITHUB_SHA,
            baseCommit: process.env.CLOVER_BASE_SHA,
            changedFiles,
            browserGate: process.env.CLOVER_INCLUDE_WEBKIT === 'true'
              ? 'chromium-desktop-mobile-plus-webkit-mobile'
              : 'chromium-desktop-mobile',
            fullWebKitIncluded: process.env.CLOVER_INCLUDE_WEBKIT === 'true',
            validationStates: ['intro', 'library-idle', 'player-active'],
            mode: 'preview-only',
            productionEligible: false,
            ownerApprovalRequired: true,
            boundaries: {
              mergeAuthorized: false,
              productionDeploymentAuthorized: false,
              productionDataAccessAuthorized: false,
              domainOrDnsChangeAuthorized: false,
              secretChangeAuthorized: false,
              externalMessageAuthorized: false,
              purchaseAuthorized: false
            }
          };
          fs.writeFileSync('.clover-preview-evidence/receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload bounded preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rollindd-clean-collection-v2-${{ env.CLOVER_CANDIDATE_SHA }}
          path: .clover-preview-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
