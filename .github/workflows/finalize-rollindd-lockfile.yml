name: Finalize RollinD dependency lockfile

on:
  push:
    branches:
      - chatpro/rollindd-clean-collection-v2-preview-20260817
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/finalize-rollindd-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatpro/rollindd-clean-collection-v2-preview-20260817
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Generate and verify deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            '@vercel/postgres': '0.10.0',
            next: '16.3.1',
            react: '19.2.8',
            'react-dom': '19.2.8',
            '@types/node': '26.2.0',
            '@types/react': '19.2.18',
            '@types/react-dom': '19.2.4',
            eslint: '9.39.5',
            'eslint-config-next': '16.3.1',
            typescript: '6.0.3'
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = lock.packages?.[`node_modules/${name}`]?.version;
            if (actual !== version) throw new Error(`${name}: expected ${version}, observed ${actual}`);
          }
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit only the lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          if ! git diff --cached --name-only | grep -qx 'package-lock.json'; then
            echo 'Refusing to commit anything except package-lock.json.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Add deterministic RollinD dependency lockfile'
          git push origin HEAD:chatpro/rollindd-clean-collection-v2-preview-20260817
